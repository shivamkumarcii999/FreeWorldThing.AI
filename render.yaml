services:
  # Backend Spring Boot Service (Docker Runtime)
  - type: web
    name: cleartaxer-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8080

  # Frontend React/Vite Service (Static Site)
  - type: web
    name: cleartaxer-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: cleartaxer-backend
          property: host
