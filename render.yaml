services:
  # Backend Spring Boot Service
  - type: web
    name: cleartaxer-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8080

  # Frontend React / Vite Static Site
  - type: static
    name: cleartaxer-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: cleartaxer-backend
          property: host
