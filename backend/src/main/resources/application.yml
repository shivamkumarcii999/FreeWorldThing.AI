server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: fwt-backend
  datasource:
    url: jdbc:h2:file:./data/fwtdb;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

fwt:
  ai:
    enabled: true
    provider: mock        # mock | openai | anthropic (pluggable via AiGateway)
    mock-fallback: true
  jwt:
    secret: ${JWT_SECRET:fwt-dev-secret-change-me-in-production-0123456789abcdef0123456789}
    ttl-hours: 72
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
